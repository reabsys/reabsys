<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/login.css">

    <link rel="icon" type="image/png" href="../assets/images/logo/ReabSYS_iconeVerde.png">

    <title>Login | ReabSYS</title>
</head>

<body>

    <main>
        <section class="login-section">

            <div class="login-div">

                <div class="logoReabSYS">
                    <img src="../assets/images/logo/ReabSYS_completa2.png" alt="Logo ReabSYS">
                </div>

                <h1>Entrar</h1>

                <div class="abas" role="tablist" aria-label="Perfil de acesso">
                    <button type="button" id="login-aba-fisio" class="aba ativa" data-form="form-fisio"
                        role="tab" aria-controls="form-fisio" aria-selected="true">Fisioterapeuta</button>
                    <button type="button" id="login-aba-paciente" class="aba" data-form="form-paciente"
                        role="tab" aria-controls="form-paciente" aria-selected="false" tabindex="-1">Paciente</button>
                </div>

                <form action="fisiomenu.html" id="form-fisio" class="formulario" role="tabpanel"
                    aria-labelledby="login-aba-fisio">

                    <div class="campo">
                        <label for="CREFITO">CREFITO *</label>

                        <input type="text" id="CREFITO" name="CREFITO" placeholder="Digite seu CREFITO" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha *</label>

                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                    </div>

                    <button type="submit">Entrar</button>

                </form>

                <form action="paciente-exercicios.html" id="form-paciente" class="formulario" role="tabpanel"
                    aria-labelledby="login-aba-paciente" hidden>

                    <div class="campo">
                        <label for="login-paciente-email">E-mail *</label>

                        <input type="email" id="login-paciente-email" name="login-paciente-email"
                            placeholder="Digite seu e-mail" maxlength="120" autocomplete="username" required>
                    </div>

                    <div class="campo">
                        <label for="login-paciente-senha">Senha *</label>

                        <input type="password" id="login-paciente-senha" name="login-paciente-senha"
                            placeholder="Digite sua senha" autocomplete="current-password" required>
                    </div>

                    <button type="submit">Entrar</button>

                </form>

                <p class="cadastro">
                    Não tem uma conta?
                    <a href="pages/cadastro.html">Cadastre-se</a>
                </p>

                <div class="demo-aviso">
                    <strong>Versão demonstrativa</strong>
                    <span>CREFITO: <b>123456-F</b></span>
                    <span>Senha: <b>123456</b></span>
                </div>

            </div>

        </section>
    </main>

    <script src="../js/menu-dados.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>
